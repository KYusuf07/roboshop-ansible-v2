    - name: install golang
      ansible.builtin.package:
        name: golang
        state: present

    - name: create roboshop user
      ansible.builtin.user:
        name: roboshop
        system: yes
        home: /app
        shell: /sbin/nologin
        comment: "roboshop system user"
        create_home: yes

    - name: ensure /app directory has correct permissions
      ansible.builtin.file:
        path: /app
        state: directory
        owner: roboshop
        group: roboshop

    - name: download and extract dispatch application
      ansible.builtin.unarchive:
        src: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/dispatch-v4.zip
        dest: /app
        remote_src: yes
        owner: roboshop
        group: roboshop

    - name: build dispatch application
      ansible.builtin.command: go build -o dispatch .
      args:
        chdir: /app

