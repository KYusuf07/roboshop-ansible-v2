    - name: systemd setup
      include_role:
        name: common
        tasks_from: systemd-setup
        
    - name: restart application
      include_role:
        name: common
        tasks_from: restart    

    - name: start and enable dispatch service
      ansible.builtin.systemd:
        name: dispatch
        state: started
        enabled: yes
        daemon_reload: yes